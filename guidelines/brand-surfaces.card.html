<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;box-sizing:border-box;font-family:var(--font-sans);color:var(--color-brand-blue-500)}.sw{display:grid;grid-auto-flow:column;gap:8px}.sw div{height:72px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:700 11px/1.3 var(--font-mono);box-sizing:border-box}.sw small{font-weight:400;opacity:.9}.tag{display:inline-block;font:400 10px/1 var(--font-mono);padding:3px 6px;border-radius:999px;border:1px solid currentColor;margin-top:4px}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="position:relative;height:140px;border-radius:16px;overflow:hidden;background:var(--color-brand-blue-500)"><div style="position:absolute;inset:0;opacity:.12;background-image:linear-gradient(90deg,#fff 1px,transparent 1px),linear-gradient(#fff 1px,transparent 1px);background-size:48px 48px"></div><div style="position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,1,.35),transparent 70%);filter:blur(30px)"></div><div style="position:absolute;left:16px;bottom:16px;right:16px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);backdrop-filter:blur(12px);color:#fff;font:400 12px/1.3 var(--font-mono)">glass · white/8% · border white/15%</div></div><div style="position:relative;height:140px;border-radius:16px;overflow:hidden;background:var(--color-brand-yellow-500)"><div style="position:absolute;inset:0;opacity:.08;background-image:linear-gradient(90deg,#0950F6 1px,transparent 1px),linear-gradient(#0950F6 1px,transparent 1px);background-size:48px 48px"></div><div style="position:absolute;left:16px;bottom:16px;font-family:var(--font-display);font-size:32px;line-height:.92;text-transform:uppercase;letter-spacing:-.03em;color:var(--color-brand-blue-500)">Hero<br>amarillo</div></div></div></body></html>
