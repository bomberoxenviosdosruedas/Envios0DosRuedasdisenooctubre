<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;box-sizing:border-box;font-family:var(--font-sans);color:var(--color-brand-blue-500)}.sw{display:grid;grid-auto-flow:column;gap:8px}.sw div{height:72px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:700 11px/1.3 var(--font-mono);box-sizing:border-box}.sw small{font-weight:400;opacity:.9}.tag{display:inline-block;font:400 10px/1 var(--font-mono);padding:3px 6px;border-radius:999px;border:1px solid currentColor;margin-top:4px}</style></head><body><div class="sw"><div style="background:#EF4444;color:#fff">error-500<small>#EF4444</small></div><div style="background:#DC2626;color:#fff">error-600<small>#DC2626</small></div><div style="background:#16A34A;color:#fff">success-500<small>#16A34A</small><span class="tag">propuesto</span></div><div style="background:#F59E0B;color:#0950F6">warning-500<small>#F59E0B</small><span class="tag">propuesto</span></div><div style="background:#F8FAFC;color:#0950F6">neutral-50<small>#F8FAFC</small></div></div></body></html>
