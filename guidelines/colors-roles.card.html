<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;box-sizing:border-box;font-family:var(--font-sans);color:var(--color-brand-blue-500)}.sw{display:grid;grid-auto-flow:column;gap:8px}.sw div{height:72px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:700 11px/1.3 var(--font-mono);box-sizing:border-box}.sw small{font-weight:400;opacity:.9}.tag{display:inline-block;font:400 10px/1 var(--font-mono);padding:3px 6px;border-radius:999px;border:1px solid currentColor;margin-top:4px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font:400 11px/1.4 var(--font-mono)"><div style="background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:12px;padding:10px;color:var(--text-body)">surface-page<br>text-body<br>border-subtle</div><div style="background:var(--surface-muted);border-radius:12px;padding:10px;color:var(--text-body)">surface-muted<br>text-body</div><div style="background:var(--surface-invert);border-radius:12px;padding:10px;color:var(--text-on-invert)">surface-invert<br>text-on-invert<br><span style="color:var(--text-on-invert-muted)">on-invert-muted</span></div><div style="background:var(--surface-accent);border-radius:12px;padding:10px;color:var(--text-on-accent)">surface-accent<br>text-on-accent<br>4.94:1</div></div><div style="margin-top:8px;font:400 11px/1.4 var(--font-mono)">action-primary #FFEC01 → hover #FFF12E · focus-ring #0950F6 (light) / #FFEC01 (dark)</div></body></html>
