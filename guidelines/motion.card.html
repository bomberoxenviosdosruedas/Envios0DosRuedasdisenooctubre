<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;box-sizing:border-box;font-family:var(--font-sans);color:var(--color-brand-blue-500)}.sw{display:grid;grid-auto-flow:column;gap:8px}.sw div{height:72px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:700 11px/1.3 var(--font-mono);box-sizing:border-box}.sw small{font-weight:400;opacity:.9}.tag{display:inline-block;font:400 10px/1 var(--font-mono);padding:3px 6px;border-radius:999px;border:1px solid currentColor;margin-top:4px}</style></head><body><div style="font:400 11px/1.6 var(--font-mono)"><div><b>default</b> cubic-bezier(.4,0,.2,1) · .15s</div><div><b>spring</b> cubic-bezier(.25,1,.5,1) · .25s CTA · .3s bezel · .6s carrusel</div><div><b>out</b> cubic-bezier(0,0,.2,1) ping · <b>pulse</b> cubic-bezier(.4,0,.6,1) 2s</div><div><b>kinetic</b> .4s scaleX(1.08) en wordmark hover · marquee 36s/42s linear</div><div style="display:flex;gap:16px;margin-top:10px;align-items:center"><span style="width:12px;height:12px;border-radius:50%;background:var(--color-brand-yellow-500);box-shadow:0 0 0 2px var(--color-brand-blue-500);animation:var(--animate-pulse)"></span><span style="position:relative;width:12px;height:12px"><span style="position:absolute;inset:0;border-radius:50%;background:var(--color-brand-blue-500);animation:var(--animate-ping)"></span><span style="position:absolute;inset:0;border-radius:50%;background:var(--color-brand-blue-500)"></span></span><span style="width:40px;height:12px;border-radius:999px;background:var(--color-brand-blue-500);animation:var(--animate-float-slow)"></span><span>pulse · ping · float-slow</span></div></div></body></html>
