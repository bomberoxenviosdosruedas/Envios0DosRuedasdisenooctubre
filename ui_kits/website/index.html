<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Envíos DosRuedas — UI kit</title><link rel="stylesheet" href="../../styles.css"><style>body{margin:0}</style></head><body>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ContactoScreen.jsx"></script>
<script type="text/babel" src="ServicioScreen.jsx"></script>
<script type="text/babel" src="EmprendedoresScreen.jsx"></script>
<script type="text/babel" src="FaqScreen.jsx"></script>
<script type="text/babel" src="NosotrosScreen.jsx"></script>
<script type="text/babel" src="RedesScreen.jsx"></script>
<script type="text/babel" src="EmpresasScreen.jsx"></script>
<script type="text/babel" src="ContrareembolsoScreen.jsx"></script>
<script type="text/babel" src="CotizadorScreen.jsx"></script>
<script type="text/babel">
const ROUTES={home:["home"],contacto:["contacto"],express:["servicio","express"],lowcost:["servicio","lowcost"],flex:["servicio","flex"],emprendedores:["emprendedores"],empresas:["empresas"],contra:["contra"],faq:["faq"],nosotros:["nosotros"],redes:["redes"],cotizador:["cotizador"]};
const LABELS=[[/^Inicio$/,"home"],[/Todos los Servicios|Express/,"express"],[/LowCost/,"lowcost"],[/Flex/,"flex"],[/Cobro/,"contra"],[/Cuenta Corriente|Cuenta corriente/,"empresas"],[/E-commerce|Depósito|Emprendedores|Fulfillment|Cotizador/,"emprendedores"],[/Sobre Nosotros|Cobertura/,"nosotros"],[/Preguntas/,"faq"],[/Redes/,"redes"],[/Contacto|Cotiz|Privacidad|Términos/,"contacto"],[/Servicios/,"express"],[/Cotizador|Cotizá/,"cotizador"]];
function App(){
  const [route,setRoute]=React.useState(()=>{const r=localStorage.getItem('eds-route');return ROUTES[r]?r:'home'});
  const [compact,setCompact]=React.useState(false);
  React.useEffect(()=>{localStorage.setItem('eds-route',route);window.scrollTo(0,0)},[route]);
  React.useEffect(()=>{const f=()=>setCompact(window.scrollY>20);window.addEventListener('scroll',f,{passive:true});return()=>window.removeEventListener('scroll',f)},[]);
  const go=(r)=>setRoute(ROUTES[r]?r:'home');
  const nav=(item)=>{const l=item.label||'';const m=LABELS.find(([re])=>re.test(l));go(m?m[1]:'home')};
  const [kind,svc]=ROUTES[route];
  const props={go,service:svc};
  const Screen={home:HomeScreen,contacto:ContactoScreen,servicio:ServicioScreen,emprendedores:EmprendedoresScreen,empresas:EmpresasScreen,contra:ContrareembolsoScreen,faq:FaqScreen,nosotros:NosotrosScreen,redes:RedesScreen,cotizador:CotizadorScreen}[kind];
  return <>
    <SkipLink href="#main" />
    <OptimizedHeader logoSrc="../../assets/logo-envios-simplified.webp" compact={compact} onNavigate={nav} onCta={()=>go('contacto')} />
    <main id="main" tabIndex={-1}><Screen {...props}/></main>
    <OptimizedFooter onNavigate={nav} onCta={()=>go('contacto')} social={<Social/>}/>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
